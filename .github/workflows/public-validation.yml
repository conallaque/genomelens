# Verifies the public release artifacts committed to this repository.
#
# This is NOT the GenomeLens production test suite. That suite is private
# because parts of it specify proprietary engine behavior. See docs/TESTING.md.
#
# CI runs the same command a reader runs locally, so local and CI verification
# cannot drift apart.
name: Public validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify public release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest runs the suite; pymupdf lets it extract and scan PDF text.
      # Raw-byte grep on a compressed PDF stream proves nothing, so those
      # checks assert text was actually extracted rather than skipping quietly.
      - name: Install verification dependencies
        run: python -m pip install --quiet pytest pymupdf

      - name: Verify public release
        run: python tools/verify_public_release.py
